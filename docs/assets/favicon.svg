<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none"
     role="img" aria-label="Selja Keränen" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .ink{stroke:#171A18;stroke-width:1.6}
    .bench{fill:#A66F5B}
    @media (prefers-color-scheme:dark){
      .ink{stroke:#E7E3D7}
      .bench{fill:#C08466}
    }
  </style>
  <!-- two-pane glasshouse gable -->
  <g class="ink">
    <path d="M7 19V12l9-6 9 6v7"/>
    <path d="M7 12l9-6 9 6"/>
    <path d="M16 6.5V19"/>
    <path d="M7 15.5h18"/>
  </g>
  <!-- benchmark -->
  <path class="bench" d="M16 21.5l3.4 6H12.6z"/>
</svg>
