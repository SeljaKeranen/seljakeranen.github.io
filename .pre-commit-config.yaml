# Fast, local guardrails. Run once with `pre-commit install`; thereafter every
# commit is checked. CI (.github/workflows/ci.yml) runs the same ruff + pytest.
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.svg$
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=200"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.6.2
    hooks:
      - id: prettier
        types_or: [css, javascript, json, yaml]

  # Guard: the design token contract + a green strict build before every commit.
  - repo: local
    hooks:
      - id: design-invariants
        name: design invariants + strict build
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        files: \.(css|html|py|yml|yaml|md|svg)$
