site_name: Selja Keränen
site_author: Selja Keränen
site_description: >-
  Selja Keränen. I build AI systems and lead the people and agents who build
  them with me, and write about keeping them honest.
site_url: https://seljakeranen.github.io/
repo_name: seljakeranen.github.io
repo_url: https://github.com/SeljaKeranen/seljakeranen.github.io/
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Selja Keränen

# Documentation for the art system — not a site page.
exclude_docs: |
  assets/art/README.md

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    # navigation.footer intentionally OFF: this is an editorial site, not a
    # linear document sequence. The Material footer pager chained Home→Blog→
    # Notes→posts into one "book" (e.g. "Next: Notes" on the blog index,
    # "Previous: 2026 / Next: Evals before prompts" on the Notes hub), which
    # reads as broken navigation. Sections are reached from the masthead.
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  # Fonts are loaded ourselves in overrides/main.html (one request, all three
  # families with the weights + axes the design needs). Disabling Material's
  # built-in loader avoids a second, redundant, under-specified request.
  font: false

nav:
  - Home: index.md
  - Blog:
    - blog/index.md
  - Notes:
    - notes/index.md
    - Evals before prompts: notes/evals-before-prompts.md
    - From proof of concept to production: notes/poc-to-production.md
    - AI-native ways of working: notes/ai-native-ways-of-working.md
  - Books: books/index.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Build hook: injects the three latest posts (with rotating line-art) into the
# homepage, and tags each post with its category's hero art. Pure stdlib.
hooks:
  - hooks/hero_art.py
  - hooks/books.py

plugins:
  - search
  - minify:
      minify_html: true
  - blog:
      blog_dir: blog
      blog_toc: true
      post_dir: blog/posts
      post_date_format: long
      post_url_format: "{date}/{slug}"
      authors_file: "{blog}/.authors.yml"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SeljaKeranen
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/selja-ker%C3%A4nen-95b4b1150/
      name: LinkedIn

# Order is load-bearing: tokens must define the variables before anything
# consumes them, and the whole chain must load after Material's own bundle so
# our attribute-scoped --md-* remaps win by source order.
extra_css:
  - stylesheets/fonts.css           # self-hosted @font-face (no Google Fonts request); load first
  - stylesheets/tokens.css          # palette + font stacks (only file with colour literals)
  - stylesheets/theme-overrides.css # remap Material --md-* onto the tokens
  - stylesheets/base.css            # type scale, reading measure, links, code, quotes
  - stylesheets/layout.css          # masthead, home, datum-line, footer
  - stylesheets/components.css      # blog rows, cards, buttons, pagination, notes rows

extra_javascript:
  - javascripts/reveal.js           # scroll fade-in; no-ops under reduced-motion
  - javascripts/books.js            # theme filter and book-note anchors
