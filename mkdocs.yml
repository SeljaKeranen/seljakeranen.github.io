site_name: Selja Keränen
site_author: Selja Keränen
site_description: >-
  Selja Keränen. AI engineer in Helsinki, building production AI systems
  and writing about what it takes to keep them working.
site_url: https://seljakeranen.github.io/
repo_name: seljakeranen.github.io
repo_url: https://github.com/SeljaKeranen/seljakeranen.github.io/
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Selja Keränen

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  font:
    text: Inter
    code: Roboto Mono

nav:
  - Home: index.md
  - Blog:
    - blog/index.md
  - Writing: writing-samples.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - minify:
      minify_html: true
  - blog:
      blog_dir: blog
      blog_toc: true
      post_dir: blog/posts
      post_date_format: long
      post_url_format: "{date}/{slug}"
      authors_file: "{blog}/.authors.yml"

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SeljaKeranen
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/selja-ker%C3%A4nen-95b4b1150/
      name: LinkedIn

extra_css:
  - stylesheets/extra.css
